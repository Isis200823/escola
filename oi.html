<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão de Perfil</title>

  <style>
    .card {
      width: 260px;
      height: 200px;
      padding: 15px 25px;
      background-color: #1e293b;
      color: white;
      border-radius: 15px;
      text-align: center;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }

    .avatar {
      font-size: 40px;
      margin-bottom: 5px;
    }

    .card h2 {
      margin: 5px 0;
      color: #38bdf8;
    }

    .card p {
      margin: 8px 0 15px;
      color: #cbd5e1;
    }

    button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="avatar">👨‍💻</div>
    <h2>Lucas Silva</h2>
    <p>Desenvolvedor Web</p>
    <button>Ver perfil</button>
  </div>

</body>
</html>
